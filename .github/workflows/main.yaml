name: goreleaser-main-buildonly

on:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        # no cache here intentionally
        id: go
        uses: actions/setup-go@v6
        with:
          # Build with the go.mod version: Go 1.27.4 panics at init in a contrib
          # dependency (SermoDigital/jose RegisterHash), which broke v1.13.0.
          go-version-file: go.mod

      - name: go-cache-paths
        id: go-cache-paths
        run: |
          echo "go-build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "go-mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Go Build Cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.go-cache-paths.outputs.go-build }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-build

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "nightly"
          args: release --clean --snapshot -f .goreleaser-buildonly.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
