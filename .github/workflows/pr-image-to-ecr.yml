name: PR Image to ECR

# On a push to a non-main branch that has an OPEN pull request, build the
# multi-arch cardinalhq-otel-collector image and push it to the public ECR
# distribution repo as v0.0.0-pr<N>-<sha8>, so the PR build is pullable from
# disposable test clusters. ECR ONLY; PR images are best-effort.
#
# The pure-Go binary is cross-compiled for amd64+arm64 on the runner (no CGO),
# then packaged with the thin Dockerfile.cross, so nothing heavy runs under QEMU.
#
# SECURITY: push-triggered (NOT pull_request), so only trusted commits pushed by
# repo-write users run here with ECR OIDC creds. Fork PRs cannot reach this
# workflow. Branches with no open PR resolve to an empty PR number and the build
# job is skipped.

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve open PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.number }}
      tag: ${{ steps.pr.outputs.tag }}
    steps:
      - name: Find open PR + image tag
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          if [ -n "$pr" ]; then
            sha8=$(echo "$SHA" | cut -c1-8)
            tag="v0.0.0-pr${pr}-${sha8}"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "Branch '$BRANCH' -> PR #$pr, image tag $tag"
          else
            echo "Branch '$BRANCH' has no open PR; skipping image build."
          fi

  build-to-ecr:
    name: Build PR Image to ECR
    needs: resolve
    if: ${{ needs.resolve.outputs.pr != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write   # AWS OIDC for ECR push
    env:
      IMAGE_VERSION: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      # --parallelism 1 links one arch at a time: the link step is multi-GB per
      # arch and two at once OOMs the runner.
      - name: Cross-build binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "nightly"
          args: build --snapshot --clean --parallelism 1 --config .goreleaser.cross.yaml

      - name: Stage per-arch binaries for Dockerfile.cross
        run: |
          for arch in amd64 arm64; do
            mkdir -p docker/bin/linux_$arch
            cp dist/cardinalhq-otel-collector_linux_${arch}*/cardinalhq-otel-collector docker/bin/linux_$arch/cardinalhq-otel-collector
          done
          ls -l docker/bin/linux_amd64 docker/bin/linux_arm64

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::${{ secrets.ECR_ACCOUNT_ID }}:role/${{ secrets.ECR_ROLE_NAME }}
          aws-region: ${{ secrets.ECR_REGISTRY_REGION }}
          role-session-name: GitHubActions

      - name: Login to PUBLIC Amazon ECR
        env:
          AWS_REGION: us-east-1
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cross
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: public.ecr.aws/cardinalhq.io/cardinalhq-otel-collector:${{ env.IMAGE_VERSION }}
