name: goreleaser-latest-dev

# Publishes the dev image at public.ecr.aws/cardinalhq.io/cardinalhq-otel-collector:<tag>
# for dev/rc tags (v*-*), built in Actions by goreleaser.
#
# Dev tags do NOT create a GitHub release (that's release.yml, for GA tags).

on:
  push:
    tags:
      - "v*-*"

permissions:
  contents: read

jobs:
  gha-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # AWS OIDC for ECR push
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        # no cache here intentionally
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: go-cache-paths
        id: go-cache-paths
        run: |
          echo "go-build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "go-mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Go Build Cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.go-cache-paths.outputs.go-build }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::${{ secrets.ECR_ACCOUNT_ID }}:role/${{ secrets.ECR_ROLE_NAME }}
          aws-region: ${{ secrets.ECR_REGISTRY_REGION }}
          role-session-name: GitHubActions

      - name: Login to PUBLIC Amazon ECR
        env:
          AWS_REGION: us-east-1
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "nightly"
          args: release --clean --parallelism 1 -f .goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sign the digest goreleaser just built (dist/artifacts.json), not whatever
      # the tag currently points at; the inspect is only an assertion they match.
      - name: Resolve built digest
        id: digest
        env:
          IMAGE: public.ecr.aws/cardinalhq.io/cardinalhq-otel-collector:${{ github.ref_name }}
        run: |
          built=$(jq -r --arg n "$IMAGE" '.[] | select(.type == "Docker Manifest" and .name == $n) | .extra.Digest' dist/artifacts.json)
          [ -n "$built" ] || { echo "::error::no Docker Manifest for $IMAGE in dist/artifacts.json"; exit 1; }
          live=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          [ "$built" = "$live" ] || { echo "::error::$IMAGE now points at $live, built $built"; exit 1; }
          echo "digest=$built" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless-sign the immutable digest (never the mutable tag) with this
      # workflow's OIDC identity, then prove the signature verifies.
      - name: Sign image
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "public.ecr.aws/cardinalhq.io/cardinalhq-otel-collector@${DIGEST}"
      - name: Verify signature
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          IDENTITY_REGEXP: '^https://github\.com/cardinalhq/cardinalhq-otel-collector/\.github/workflows/dev\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+-.+$'
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            "public.ecr.aws/cardinalhq.io/cardinalhq-otel-collector@${DIGEST}" > /dev/null
          exact="${IDENTITY_REGEXP%/*}/${GITHUB_REF_NAME//./\\.}\$"
          {
            echo "## Signed image"
            echo ""
            echo "- \`public.ecr.aws/cardinalhq.io/cardinalhq-otel-collector@${DIGEST}\`"
            echo "- verify: \`cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp '$exact' <image>\`"
          } >> "$GITHUB_STEP_SUMMARY"
