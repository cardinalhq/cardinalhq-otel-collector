name: goreleaser-release-latest

# GA tags (vX.Y.Z, not vX.Y.Z-*): goreleaser builds the multi-arch image in
# Actions and pushes it to public ECR, then the GitHub Release is published.

on:
  push:
    tags:
      - "v*"
      - "!v*-*"

permissions:
  contents: read

jobs:
  gha-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # AWS OIDC for ECR push
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: go-cache-paths
        id: go-cache-paths
        run: |
          echo "go-build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "go-mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Go Build Cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.go-cache-paths.outputs.go-build }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::${{ secrets.ECR_ACCOUNT_ID }}:role/${{ secrets.ECR_ROLE_NAME }}
          aws-region: ${{ secrets.ECR_REGISTRY_REGION }}
          role-session-name: GitHubActions

      - name: Login to PUBLIC Amazon ECR
        env:
          AWS_REGION: us-east-1
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "nightly"
          args: release --clean --parallelism 1 -f .goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

  release:
    needs: gha-build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release create
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping creation."
            exit 0
          fi

          LAST_RELEASE=$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --exclude-pre-releases \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName' || echo "")

          if [ -n "$LAST_RELEASE" ]; then
            RELEASE_NOTES="## Changes since ${LAST_RELEASE}"$'\n\n'
            RELEASE_NOTES+=$(git log --oneline "${LAST_RELEASE}..HEAD" --no-merges | sed 's/^/* /')
          else
            RELEASE_NOTES="## Changes"$'\n\n'
            RELEASE_NOTES+=$(git log --oneline --no-merges | head -10 | sed 's/^/* /')
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $RELEASE_TAG" \
            --notes "$RELEASE_NOTES" \
            --latest
